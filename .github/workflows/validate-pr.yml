name: Validate MBF Monitor Android PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/validate-pr.yml'

permissions:
  contents: read

concurrency:
  group: monitor-android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate unsigned release APK
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate unsigned APK compilation
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew :app:assembleRelease --no-daemon --build-cache
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
