plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bloise.mbfmonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.bloise.mbfmonitor"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado no CI com a keystore gerada (signingConfig via linha de comando).
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Firebase Cloud Messaging (push)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}

// Aplica o plugin do Google Services apenas se o google-services.json existir,
// para o build não quebrar quando o arquivo ainda não foi fornecido.
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}
